<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6fb" />
    <meta name="description" content="Pronunciation practice that runs entirely on your device." />
    <title>Vaani</title>
    <script>
      // Apply the saved theme before first paint (no flash).
      try { var t = localStorage.getItem('vaani-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
